<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chord Atlas – Fretboard Voicings</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#231f1a;--mut:#7a7165;--line:#d9d0c2;--acc:#c2410c;--wood:#e9d8b8;--fret:#a89a82;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--card:#221e17;--ink:#f1ebe0;--mut:#9d9384;--line:#3a3328;--wood:#3b3123;--fret:#7d705a}}
:root[data-theme="dark"]{--bg:#17140f;--card:#221e17;--ink:#f1ebe0;--mut:#9d9384;--line:#3a3328;--wood:#3b3123;--fret:#7d705a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0}.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.roots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 8px;cursor:pointer}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
select{flex:1;min-width:140px}
.title{font-size:20px;font-weight:700}.meta{color:var(--mut);font-size:13px}
.board{overflow-x:auto;margin-top:8px}.board svg{min-width:760px;width:100%;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.mini{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:2px;cursor:pointer}
.mini.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.mini svg{width:100%;display:block}
.cap{font-size:10px;text-align:center;color:var(--mut);padding-bottom:3px}
label{font-size:13px;color:var(--mut)}
</style></head><body><div class="wrap">
<h1>🎸 Chord Atlas</h1>
<div class="sub" id="stat">Building every voicing…</div>
<div class="card">
 <div class="roots" id="roots"></div>
 <div class="row"><select id="qual"></select><select id="inv"></select></div>
 <div class="row">
  <span style="color:var(--mut);font-size:13px">Labels</span>
  <button data-l="note" class="on">Notes</button><button data-l="int">Intervals</button><button data-l="none">None</button>
  <label><input type="checkbox" id="ghost" checked> chord tones</label>
 </div>
</div>
<div class="card">
 <div class="title" id="name"></div><div class="meta" id="meta"></div>
 <div class="board" id="board"></div>
 <div class="row"><button id="prev">◀ Prev</button><button id="play" class="on">▶ Strum</button><button id="next">Next ▶</button></div>
</div>
<div class="card"><div class="grid" id="grid"></div><div class="row"><button id="more" style="display:none">Show more voicings</button></div></div>
</div>
<script>
const OPEN=[40,45,50,55,59,64],R=['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const L=['R','♭9','9','♭3','3','4','♭5','5','♯5','6','♭7','7'];
const INV=['Root position','1st inversion','2nd inversion','3rd inversion','Extension in bass'];
const Q=[['','Major',[0,4,7]],['m','Minor',[0,3,7]],['dim','Diminished',[0,3,6]],['aug','Augmented',[0,4,8]],['sus2','Suspended 2nd',[0,2,7]],['sus4','Suspended 4th',[0,5,7]],['5','Power chord',[0,7]],
['6','Major 6th',[0,4,7,9]],['m6','Minor 6th',[0,3,7,9]],['6/9','Six-nine',[0,4,7,9,2]],['maj7','Major 7th',[0,4,7,11]],['7','Dominant 7th',[0,4,7,10]],['m7','Minor 7th',[0,3,7,10]],['m7♭5','Half-diminished',[0,3,6,10]],['dim7','Diminished 7th',[0,3,6,9]],['m(maj7)','Minor-major 7th',[0,3,7,11]],['7sus4','Dominant 7 sus4',[0,5,7,10]],
['maj9','Major 9th',[0,4,7,11,2]],['9','Dominant 9th',[0,4,7,10,2]],['m9','Minor 9th',[0,3,7,10,2]],['add9','Add 9',[0,4,7,2]],['m(add9)','Minor add 9',[0,3,7,2]],['7♭9','7 flat 9',[0,4,7,10,1]],['7♯9','7 sharp 9',[0,4,7,10,3]],['7♯5','7 sharp 5',[0,4,8,10]],['7♭5','7 flat 5',[0,4,6,10]],['maj7♯5','Major 7 sharp 5',[0,4,8,11]],['maj7♯11','Major 7 sharp 11',[0,4,7,11,6]],
['11','Dominant 11th',[0,4,7,10,2,5]],['m11','Minor 11th',[0,3,7,10,2,5]],['13','Dominant 13th',[0,4,7,10,2,9]],['m13','Minor 13th',[0,3,7,10,2,9]],['maj13','Major 13th',[0,4,7,11,2,9]]];
const cache={};let total=0;
function gen(r,qi){const iv=Q[qi][2],set=new Set(iv.map(x=>(x+r)%12));
 let need=iv.length>=4?iv.filter(x=>x!==7):iv;if(iv.length>=6)need=need.filter(x=>x!==2);
 const nd=need.map(x=>(x+r)%12),minS=iv.length<=3?3:4,out=[],seen=new Set();
 for(let b=0;b<=11;b++){
  const opts=OPEN.map(o=>{const a=[-1];for(let f=b;f<=b+4;f++)if(set.has((o+f)%12))a.push(f);return a});
  const cur=[];
  (function d(s,st){
   if(s===6){const snd=cur.filter(f=>f>=0);if(snd.length<minS)return;
    const pcs=new Set();cur.forEach((f,i)=>{if(f>=0)pcs.add((OPEN[i]+f)%12)});
    if(!nd.every(p=>pcs.has(p)))return;
    const fr=snd.filter(f=>f>0);if(fr.length){const m=Math.min(...fr),nm=fr.filter(f=>f===m).length;
     if(nm>=2){if(fr.filter(f=>f>m).length>3)return}else if(fr.length>4)return}
    const k=cur.join();if(seen.has(k))return;seen.add(k);
    const bi=cur.findIndex(f=>f>=0),bint=(OPEN[bi]+cur[bi]-r+12)%12,idx=iv.indexOf(bint);
    out.push({f:cur.slice(),inv:Math.min(idx,4),mn:fr.length?Math.min(...fr):0});return}
   for(const f of opts[s]){
    if(f<0){if(st===1){cur[s]=-1;d(s+1,2)}else{cur[s]=-1;d(s+1,st)}}
    else if(st!==2){cur[s]=f;d(s+1,1)}}
  })(0,0);
 }
 out.sort((a,b)=>a.mn-b.mn||a.inv-b.inv);return out}
const get=(r,qi)=>cache[r+','+qi];
let r=0,qi=0,inv=-1,sel=0,lab='note',shown=36,list=[];
const $=s=>document.querySelector(s);
function build(){for(let a=0;a<12;a++)for(let q=0;q<Q.length;q++){const v=gen(a,q);cache[a+','+q]=v;total+=v.length}
 $('#stat').textContent=total.toLocaleString()+' chord voicings and inversions across 12 roots and '+Q.length+' chord types – tap any diagram to see it on the neck.';
 $('#roots').innerHTML=R.map((n,i)=>`<button data-r="${i}" class="${i===r?'on':''}">${n}</button>`).join('');
 $('#qual').innerHTML=Q.map((q,i)=>`<option value="${i}">${q[1]} (${q[0]||'maj'})</option>`).join('');
 $('#inv').innerHTML='<option value="-1">All inversions</option>'+INV.map((n,i)=>`<option value="${i}">${n}</option>`).join('');
 render()}
function render(){list=get(r,qi).filter(v=>inv<0||v.inv===inv);if(sel>=list.length)sel=0;
 const full=get(r,qi).length,cn=R[r]+Q[qi][0];
 $('#name').textContent=cn+'  ·  '+Q[qi][1];
 const v=list[sel];
 if(v){$('#meta').textContent='Voicing '+(sel+1)+' of '+list.length+' · '+INV[v.inv]+' · '+full+' total for this chord · notes: '+Q[qi][2].map(x=>R[(x+r)%12]).join(' ');$('#board').innerHTML=board(v)}
 else{$('#meta').textContent='No voicings for this filter.';$('#board').innerHTML=''}
 $('#grid').innerHTML=list.slice(0,shown).map((v,i)=>`<div class="mini ${i===sel?'sel':''}" data-i="${i}">${mini(v)}<div class="cap">${['Root','1st','2nd','3rd','Ext.'][v.inv]}</div></div>`).join('');
 $('#more').style.display=list.length>shown?'':'none';$('#more').textContent='Show more ('+(list.length-shown)+' left)';
 document.querySelectorAll('#roots button').forEach((b,i)=>b.classList.toggle('on',i===r))}
function lbl(i,f){const p=(OPEN[i]+f)%12;return lab==='note'?R[p]:lab==='int'?L[(p-r+12)%12]:''}
function board(v){const W=40,FW=56,top=24,gap=30,set=new Set(Q[qi][2].map(x=>(x+r)%12));
 let s=`<svg viewBox="0 0 ${W+FW*15+16} 210" font-family="system-ui" text-anchor="middle">`;
 s+=`<rect x="${W}" y="${top-8}" width="${FW*15}" height="${gap*5+16}" fill="var(--wood)" rx="3"/>`;
 [3,5,7,9,15].forEach(n=>s+=`<circle cx="${W+(n-.5)*FW}" cy="${top+gap*2.5}" r="6" fill="var(--fret)" opacity=".45"/>`);
 s+=`<circle cx="${W+11.5*FW}" cy="${top+gap*1.5}" r="6" fill="var(--fret)" opacity=".45"/><circle cx="${W+11.5*FW}" cy="${top+gap*3.5}" r="6" fill="var(--fret)" opacity=".45"/>`;
 for(let n=0;n<=15;n++){const x=W+n*FW;s+=`<line x1="${x}" x2="${x}" y1="${top-8}" y2="${top+gap*5+8}" stroke="var(--fret)" stroke-width="${n?1.5:5}"/>`;
  if(n)s+=`<text x="${x-FW/2}" y="${top+gap*5+30}" font-size="11" fill="var(--mut)">${n}</text>`}
 for(let i=0;i<6;i++){const y=top+(5-i)*gap;s+=`<line x1="${W}" x2="${W+FW*15}" y1="${y}" y2="${y}" stroke="var(--mut)" stroke-width="${2.4-i*.3}"/>`}
 if($('#ghost').checked)for(let i=0;i<6;i++)for(let f=0;f<=15;f++)if(set.has((OPEN[i]+f)%12)){const x=f?W+(f-.5)*FW:W-16,y=top+(5-i)*gap;s+=`<circle cx="${x}" cy="${y}" r="7" fill="var(--mut)" opacity=".3"/>`}
 v.f.forEach((f,i)=>{const y=top+(5-i)*gap;if(f<0){s+=`<text x="${W-16}" y="${y+5}" font-size="15" fill="var(--mut)">✕</text>`;return}
  const x=f?W+(f-.5)*FW:W-16,p=(OPEN[i]+f)%12;
  s+=`<circle cx="${x}" cy="${y}" r="12" fill="${p===r?'#c2410c':'#2a4d7a'}"/><text x="${x}" y="${y+4}" font-size="11" font-weight="700" fill="#fff">${lbl(i,f)}</text>`});
 return s+'</svg>'}
function mini(v){const fr=v.f.filter(f=>f>0),mx=Math.max(0,...fr),mn=fr.length?Math.min(...fr):1,base=mx<=4?1:mn;
 let s='<svg viewBox="0 0 84 96" font-family="system-ui" text-anchor="middle">';
 for(let j=0;j<=5;j++)s+=`<line x1="16" x2="71" y1="${20+j*14}" y2="${20+j*14}" stroke="var(--fret)" stroke-width="${j===0&&base===1?3:1}"/>`;
 for(let k=0;k<6;k++)s+=`<line x1="${16+k*11}" x2="${16+k*11}" y1="20" y2="90" stroke="var(--mut)" stroke-width=".9"/>`;
 if(base>1)s+=`<text x="7" y="31" font-size="10" fill="var(--mut)">${base}</text>`;
 v.f.forEach((f,k)=>{const x=16+k*11;if(f<0)s+=`<text x="${x}" y="15" font-size="9" fill="var(--mut)">✕</text>`;
  else if(f===0)s+=`<circle cx="${x}" cy="12" r="3" fill="none" stroke="var(--mut)"/>`;
  else{const p=(OPEN[k]+f)%12;s+=`<circle cx="${x}" cy="${20+(f-base)*14+7}" r="4.6" fill="${p===r?'#c2410c':'#2a4d7a'}"/>`}});
 return s+'</svg>'}
let ac;function play(){const v=list[sel];if(!v)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
 let t=ac.currentTime;v.f.forEach((f,i)=>{if(f<0)return;const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';
  o.frequency.value=440*Math.pow(2,(OPEN[i]+f-69)/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+1.6);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+1.7);t+=.05})}catch(e){}}
$('#roots').onclick=e=>{const b=e.target.closest('[data-r]');if(b){r=+b.dataset.r;sel=0;shown=36;render()}};
$('#qual').onchange=e=>{qi=+e.target.value;sel=0;shown=36;render()};
$('#inv').onchange=e=>{inv=+e.target.value;sel=0;shown=36;render()};
$('#ghost').onchange=render;
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lab=b.dataset.l;document.querySelectorAll('[data-l]').forEach(x=>x.classList.toggle('on',x===b));render()});
$('#grid').onclick=e=>{const m=e.target.closest('.mini');if(m){sel=+m.dataset.i;render();play()}};
$('#more').onclick=()=>{shown+=60;render()};
$('#prev').onclick=()=>{if(list.length){sel=(sel-1+list.length)%list.length;if(sel>=shown)shown=sel+1;render()}};
$('#next').onclick=()=>{if(list.length){sel=(sel+1)%list.length;if(sel>=shown)shown=sel+1;render()}};
$('#play').onclick=play;
addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowLeft')$('#prev').click()});
setTimeout(build,30);
</script></body></html>
